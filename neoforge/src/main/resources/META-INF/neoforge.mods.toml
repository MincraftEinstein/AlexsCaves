modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/MincraftEinstein/AlexsCaves/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = ""
    logoFile = "pack.png"
    credits = ""
    authors = "${mod_authors}"
    description = '''${description}'''
    enumExtensions="META-INF/enumextensions.json"

[modProperies]
    fzzy_config = "alexscaves"

[[accessTransformers]]
    file = "META-INF/accesstransformer.cfg"

[[mixins]]
    config = "${mod_id}.neoforge.mixins.json"

[[mixins]]
    config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version}, ${max_minecraft_version})"
    ordering = "NONE"
    side = "BOTH"

[modproperties.${mod_id}]
    catalogueItemIcon = "alexscaves:stone"
